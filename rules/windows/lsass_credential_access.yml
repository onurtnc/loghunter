title: LSASS Bellek Erisimi (Kimlik Bilgisi Hirsizligi)
id: win-lsass-003
description: >
  lsass.exe surecine yuksek yetkili erisim, Mimikatz benzeri araclarla parola
  ozeti cikarma girisiminin klasik gostergesidir.
level: critical
author: LogHunter
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 10
    TargetImage|endswith: \lsass.exe
  access:
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x143a'
      - '0x1f0fff'
      - '0x1fffff'
  filter:
    SourceImage|endswith:
      - \MsMpEng.exe
      - \wmiprvse.exe
  condition: selection and access and not filter
tags:
  - attack.t1003.001
  - attack.credential-access
falsepositives:
  - Antivirus ve EDR ajanlarinin bellek taramalari
