title: SSH Kaba Kuvvet Saldirisi
id: lnx-ssh-bruteforce-101
description: >
  Ayni IP adresinden kisa surede tekrarlanan basarisiz SSH parola denemeleri.
level: high
author: LogHunter
logsource:
  product: linux
  service: auth
detection:
  selection:
    event_type:
      - ssh_failed_login
      - ssh_invalid_user
  timeframe_config:
    count: 5
    window_minutes: 5
    group_by:
      - src_ip
  condition: selection
tags:
  - attack.t1110.001
  - attack.credential-access
